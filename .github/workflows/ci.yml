name: Rust CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - "*.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ startsWith(matrix.os, 'windows') && '-C target-feature=+crt-static' || '' }}
      CFLAGS_x86_64_pc_windows_msvc: /MT
      CFLAGS_aarch64_pc_windows_msvc: -fms-runtime-lib=static
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
              ${{ matrix.os }}-cargo-

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt -- --check

      - name: Build on ${{ matrix.os }}
        run: cargo build

      - name: Run tests on ${{ matrix.os }}
        run: cargo test

      - name: Run clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets 2>&1
