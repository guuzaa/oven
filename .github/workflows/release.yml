name: Release CI

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04
            target: loongarch64-unknown-linux-musl
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.28
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.28
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
              release-${{ matrix.target }}-

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.1"
          cache-key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build for Linux
        if: runner.os == 'Linux'
        env:
          ZIG_TARGET: ${{ matrix.zig_target || matrix.target }}
        run: cargo zigbuild --release --target "$ZIG_TARGET"

      - name: Build for macOS
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          src="target/${target}/release/oven"
          test -f "${src}"
          mkdir -p "dist/oven-${target}"
          cp "${src}" "dist/oven-${target}/oven"
          tar -C dist -czf "oven-${{ github.ref_name }}-${target}.tar.gz" "oven-${target}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oven-${{ matrix.target }}
          path: oven-*.tar.gz
          if-no-files-found: error

  build-msvc:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      RUSTFLAGS: -C target-feature=+crt-static
      CFLAGS_x86_64_pc_windows_msvc: /MT
      CFLAGS_aarch64_pc_windows_msvc: -fms-runtime-lib=static
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
              release-${{ matrix.target }}-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $src = "target/$target/release/oven.exe"
          if (-not (Test-Path $src)) { throw "build artifact not found: $src" }
          $dir = "dist/oven-$target"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $src "$dir/oven.exe"
          Compress-Archive -Path $dir -DestinationPath "oven-${{ github.ref_name }}-$target.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oven-${{ matrix.target }}
          path: oven-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, build-msvc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: oven-*
          path: artifacts
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: false
          fail_on_unmatched_files: true
