[workspace]
members = ["crates/oven-agent", "crates/oven-app", "crates/oven-tui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A toy coding agent for joy only."

[workspace.dependencies]
oven-app = { path = "./crates/oven-app" }
oven-agent = { path = "./crates/oven-agent" }
oven-tui = { path = "./crates/oven-tui" }
oven-llm = "0.3.1"

# External dependencies
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
ratatui = "0.30.2"
tui-textarea-2 = "0.12"
unicode-width = "0.2"
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.1"
cross-xdg = "2"
tempdir = "0.3.7"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "rt",
    "sync",
] }
tokio-util = "0.7"
tokio-stream = "0.1"
mockall = "0.15.0"
wiremock = "0.6.5"
globset = "0.4"
ignore = "0.4"
regex = "1"
http = "1"
rmcp = { version = "3.1.2", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
] }

[profile.release]
opt-level = 2
lto = "thin"
