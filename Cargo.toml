[workspace]
members = ["crates/oven-agent", "crates/oven-app", "crates/oven-tui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
oven-app = { path = "./crates/oven-app" }
oven-agent = { path = "./crates/oven-agent" }
oven-tui = { path = "./crates/oven-tui" }
oven-llm = "0.1.2"

# External dependencies
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures = "0.3"
async-stream = "0.3"
bytes = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
ratatui = "0.30.2"
tui-textarea-2 = "0.12"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempdir = "0.3.7"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "rt",
    "sync",
] }
tokio-stream = "0.1"
mockall = "0.15.0"
wiremock = "0.6.5"
secrecy = "0.10"
