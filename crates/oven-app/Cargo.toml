[package]
name = "oven-app"
description = "Application layer: service composition"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[dependencies]
oven-llm = { workspace = true }
oven-agent = { workspace = true }
oven-host = { workspace = true }
oven-mem = { workspace = true }
oven-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
async-trait = { workspace = true }
futures = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
htmd = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
rmcp = { workspace = true }
http = { workspace = true }
nucleo = { workspace = true }
nucleo-matcher = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Globalization"] }

[dev-dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
mockall = { workspace = true }
tempdir = { workspace = true }
wiremock = { workspace = true }
axum = { workspace = true, default-features = false, features = ["http1", "tokio"] }
# Test-only MCP server features; unified only when building tests.
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
