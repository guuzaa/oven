# Oven configuration template. Used as the project-level example (copy it to
# the workspace root as `.oven.toml`) and as the default user config written
# to `~/.oven/config.toml` on first run. All fields are
# optional; environment variables take precedence where noted.

# Per-request timeout in seconds.
request_timeout_secs = 60

# Number of retries after a transient failure before giving up.
max_retries = 2

# Initial backoff between retries, in ms. Doubles per attempt (exponential).
base_backoff_ms = 500

# Tools to mount. Empty means the built-in default set
# (file_read, file_write, bash).
# tools = ["file_read", "file_write", "bash"]

# LLM provider settings.
[provider]
# Canonical vendor slug. Aliases are accepted on read (`grok` → `xai`,
# `kimi` → `moonshot`, `glm` → `zhipu`) and rewritten as the canonical name.
# name = "deepseek"
# Wire id only; oven joins it with `name` (e.g. deepseek/deepseek-v4-flash).
# model = "deepseek-v4-flash"
# Override the API endpoint. Useful for OpenAI-compatible proxies.
# base_url = "https://api.deepseek.com"
# Wire protocol for unknown/custom vendors only. Known vendors ignore this;
# they pick a protocol from the model catalog (or a `:responses` suffix).
# protocol = "completions"
# Explicit API key. If unset, the OVEN_API_KEY env var is used.
# api_key = "sk-..."
# Reasoning effort: "none", "low", "medium", or "high". Unset leaves thinking off
# until /setup (which defaults to medium) or /model <id> <effort>.
# reasoning_effort = "medium"

# MCP servers to connect to at startup: stdio via command/args/env, or a
# remote streamable HTTP endpoint via url (headers optional). Each server's
# tools are discovered via tools/list and mounted as `<server_id>_<tool_name>`
# (e.g. the filesystem server's read_file tool becomes filesystem_read_file).
# [mcps.filesystem]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/abs/path"]
# [mcps.filesystem.env]
# FOO = "bar"
# [mcps.remote]
# url = "https://example.com/mcp"
# [mcps.remote.headers]
# Authorization = "Bearer sk-xxx"
