name = "oven-dist"
main = "src/index.ts"
compatibility_date = "2025-09-01"

routes = [{ pattern = "oven.paulden.site", custom_domain = true }]

# The public site: hand-written static files, no build step. Requests for paths
# that are neither an asset nor a route above are answered by the worker with
# index.html, so client-side routes survive a hard refresh.
[assets]
directory = "./public"
binding = "ASSETS"

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 0.1
